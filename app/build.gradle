plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.aud_player'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.aud_player"
        minSdk 24
        targetSdk 34
        versionCode 72
        versionName "7.2"

        // Modern phones only (arm64) — drop emulator (x86) and old 32-bit
        // (armeabi-v7a) ABIs to keep the APK small.
        ndk {
            abiFilters 'arm64-v8a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(
                    getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.media:media:1.6.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // FFmpeg for the Audio + Video Editor (cut / split / merge).
    // Maintained drop-in replacement for the retired com.arthenica
    // ffmpeg-kit (same package/API, SDK 35 + 16KB pages).
    // full-gpl: adds libx264/libx265 so the video editor can re-encode the
    // few seconds around a cut point (smart cut) — min has no H.264 encoder.
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl:8.1.7'
}