plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.aud_player'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.aud_player"
        minSdk 24
        targetSdk 34
        versionCode 72
        versionName "7.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(
                    getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.media:media:1.6.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // FFmpeg for the Audio Editor (cut / split / merge).
    // Maintained drop-in replacement for the retired com.arthenica
    // ffmpeg-kit (same package/API, SDK 35 + 16KB pages).
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-min:8.1.7'
}